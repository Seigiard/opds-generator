<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reader</title>
    <meta name="foliate-base" content="/static/foliate-1ebf718de3ee" />
    <!-- No favicon links: the reader CSP (img-src blob: data:) blocks them, so they
         would only generate console noise. -->
    <style>
      :root{--reader-bg:#faf8f5;--reader-text:#2b2620;--reader-muted:#8a8177;--reader-accent:#b8552f;--reader-border:#e5dfd6;--reader-bar-height:3rem}@media(prefers-color-scheme:dark){:root{--reader-bg:#1c1a17;--reader-text:#e8e3db;--reader-muted:#918a80;--reader-accent:#d97a52;--reader-border:#35322d}}*{box-sizing:border-box}

/* reader.css is inlined alone (no reset.css), and author display:flex on .reader/.reader__bar
   beats the UA [hidden] rule — without this the empty chrome flashes before load and shows
   behind every error state. */[hidden]{display:none!important}body,html{margin:0;height:100%;background:var(--reader-bg);color:var(--reader-text);font-family:system-ui,sans-serif}.reader{display:flex;flex-direction:column;height:100%}.reader__bar{display:flex;align-items:center;gap:1rem;height:var(--reader-bar-height);padding:0 1rem;border-bottom:1px solid var(--reader-border);flex:none}.reader__download,.reader__return{color:var(--reader-accent);text-decoration:none;font-size:.875rem;white-space:nowrap}.reader__download:hover,.reader__return:hover{text-decoration:underline}.reader__title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.875rem;text-align:center;color:var(--reader-muted)}.reader__nav-btn,.reader__toc-toggle{-webkit-appearance:none;-moz-appearance:none;appearance:none;background:none;border:1px solid var(--reader-border);border-radius:.375rem;color:var(--reader-text);font-size:.875rem;padding:.25rem .75rem;cursor:pointer}.reader__nav-btn:hover,.reader__toc-toggle:hover{border-color:var(--reader-accent);color:var(--reader-accent)}.reader__toc{position:fixed;top:var(--reader-bar-height);left:0;bottom:0;width:calc(min(20rem,85vw));overflow-y:auto;background:var(--reader-bg);border-right:1px solid var(--reader-border);padding:1rem;z-index:10}.reader__toc ol{list-style:none;margin:0;padding-left:0}.reader__toc ol ol{padding-left:1rem}.reader__toc a{display:block;padding:.25rem 0;color:var(--reader-text);text-decoration:none;font-size:.875rem}.reader__toc a:hover{color:var(--reader-accent)}.reader__view{flex:1;min-height:0;position:relative}.reader__view>*{width:100%;height:100%}.reader__footer{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.5rem 1rem;border-top:1px solid var(--reader-border);flex:none}.reader__position{font-size:.75rem;color:var(--reader-muted)}.reader-fallback{max-width:30rem;margin:4rem auto;padding:0 1.5rem;text-align:center;line-height:1.6}.reader-fallback a{color:var(--reader-accent)}
    </style>
  </head>
  <body>
    <noscript>
      <div class="reader-fallback">
        <p>This reader needs JavaScript. You can download books directly from the catalog instead.</p>
        <p><a href="/">Back to catalog</a></p>
      </div>
    </noscript>
    <div id="reader" class="reader" hidden>
      <header class="reader__bar">
        <a id="reader-return" class="reader__return" href="/">Catalog</a>
        <button id="reader-toc-toggle" class="reader__toc-toggle" type="button" aria-expanded="false" aria-controls="reader-toc" hidden>
          Contents
        </button>
        <span id="reader-title" class="reader__title"></span>
        <a id="reader-download" class="reader__download" hidden>Download</a>
      </header>
      <nav id="reader-toc" class="reader__toc" hidden aria-label="Table of contents"></nav>
      <main id="reader-view" class="reader__view"></main>
      <footer class="reader__footer">
        <button id="reader-prev" class="reader__nav-btn" type="button" aria-label="Previous page" hidden>&#8592;</button>
        <span id="reader-position" class="reader__position"></span>
        <button id="reader-next" class="reader__nav-btn" type="button" aria-label="Next page" hidden>&#8594;</button>
      </footer>
    </div>
    <div id="reader-error" class="reader-fallback" hidden>
      <p id="reader-error-message"></p>
      <p><a id="reader-error-return" href="/">Back to catalog</a></p>
    </div>
    <script type="module" src="/static/reader.js"></script>
  </body>
</html>
