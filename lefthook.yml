glob_matcher: doublestar

pre-commit:
  piped: true
  jobs:
    - name: format
      exclude:
        - "static/**"
        - "ui/vendor/**"
        - "test/golden/**"
        - "tools/oxlint/anti-slop/**"
      run: bunx --no-install oxfmt --write --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: lint
      glob: "**/*.{ts,js,mjs}"
      run: bunx --no-install oxlint --fix --deny-warnings {staged_files}
      stage_fixed: true
    - name: typecheck
      glob: "**/*.ts"
      run: bun --bun tsc --noEmit
