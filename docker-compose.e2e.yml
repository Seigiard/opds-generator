services:
  opds:
    build:
      context: .
      target: production
    ports:
      - "${TEST_PORT:-8080}:80"
    volumes:
      - ./files:/books
      - opds-data:/data
    environment:
      - FILES=/books
      - DATA=/data
      - PORT=3000
      - ADMIN_USER=admin
      - ADMIN_TOKEN=secret
    healthcheck:
      test: ["CMD", "/bin/sh", "/app/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  opds-data:
